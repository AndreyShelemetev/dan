<!-- @dsCard group="Components" viewport="700x300" subtitle="Alert, Dialog, Toast" name="Обратная связь" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:20px;display:flex;flex-direction:column;gap:14px;">
<div style="background:var(--warning-soft);border-radius:4px;padding:14px 18px;max-width:520px;">
  <div style="font-size:14px;font-weight:700;color:var(--warning);margin-bottom:2px;">Нужно уточнить участок</div>
  <div style="font-size:14px;line-height:1.5;">Данных недостаточно для поиска места. Добавьте ориентиры или закажите осмотр.</div>
</div>
<div style="background:var(--surface-raised);border-radius:6px;box-shadow:var(--shadow-modal);padding:22px;max-width:420px;">
  <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
    <span style="font-family:var(--font-display);font-size:20px;">Принять смету?</span>
    <span style="color:var(--ink-3);font-size:18px;">×</span>
  </div>
  <div style="font-size:14px;color:var(--ink-2);line-height:1.55;">После принятия изменение строк потребует повторного согласия.</div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
    <button style="font-family:var(--font-ui);font-weight:600;font-size:13px;padding:10px 20px;border-radius:999px;background:transparent;border:1px solid var(--border-strong);color:var(--ink-1);">Назад</button>
    <button style="font-family:var(--font-ui);font-weight:600;font-size:13px;padding:10px 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);border:none;">Принять версию 2</button>
  </div>
</div>
<div style="display:inline-flex;align-items:center;gap:12px;background:var(--ink-1);color:var(--ink-inverse);border-radius:4px;padding:12px 18px 12px 14px;font-size:14px;box-shadow:var(--shadow-raised);width:fit-content;">
  <span style="width:4px;align-self:stretch;border-radius:2px;background:var(--success);"></span>Черновик сохранён
</div>
</body></html>
