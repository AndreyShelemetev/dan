<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:20px;display:flex;gap:32px;">
<div style="flex:1;display:flex;flex-direction:column;">
  <div style="display:flex;gap:14px;"><div style="display:flex;flex-direction:column;align-items:center;"><div style="width:12px;height:12px;border-radius:50%;background:var(--accent);border:1px solid var(--accent);"></div><div style="width:1px;flex:1;background:var(--border-strong);min-height:22px;"></div></div><div style="padding-bottom:16px;margin-top:-2px;"><div style="font-size:14px;font-weight:600;">Смета принята</div><div style="font-size:12px;color:var(--ink-3);">Версия 2 · 12 640 ₽</div></div></div>
  <div style="display:flex;gap:14px;"><div style="display:flex;flex-direction:column;align-items:center;"><div style="width:12px;height:12px;border-radius:50%;background:var(--accent);border:1px solid var(--accent);box-shadow:0 0 0 3px rgba(74,97,81,.28);"></div><div style="width:1px;flex:1;background:var(--border-strong);min-height:22px;"></div></div><div style="padding-bottom:16px;margin-top:-2px;"><div style="font-size:14px;font-weight:700;">Работа выполняется</div><div style="font-size:12px;color:var(--ink-3);">Визит: 19–21 августа</div></div></div>
  <div style="display:flex;gap:14px;"><div style="width:12px;height:12px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);"></div><div style="margin-top:-2px;font-size:14px;font-weight:600;color:var(--ink-3);">Проверяем качество</div></div>
</div>
<div style="flex:1.2;">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px;">Общий вид участка</div>
  <div style="display:flex;gap:12px;">
    <div style="flex:1;"><div style="aspect-ratio:4/3;background:#E9E1D4;border-radius:4px;display:grid;place-items:center;font-size:13px;color:var(--ink-3);">до</div><div style="font-size:12px;color:var(--ink-3);text-align:center;margin-top:6px;">до</div></div>
    <div style="flex:1;"><div style="aspect-ratio:4/3;background:var(--accent-soft);border-radius:4px;display:grid;place-items:center;font-size:13px;color:var(--ink-3);">после</div><div style="font-size:12px;color:var(--ink-3);text-align:center;margin-top:6px;">после</div></div>
  </div>
</div>
</body></html>
