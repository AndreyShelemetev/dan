<!-- @dsCard group="Components" viewport="700x260" subtitle="Карточка, бейджи, метки" name="Отображение" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:20px;display:flex;flex-direction:column;gap:16px;">
<div style="background:var(--surface-card);border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow-card);padding:20px;max-width:420px;">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
    <span style="font-family:var(--font-display);font-size:20px;">Заказ № 2418</span>
    <span style="font-size:12px;color:var(--ink-3);">14 августа</span>
  </div>
  <div style="font-size:14px;color:var(--ink-2);line-height:1.55;">Базовый уход · Смоленское кладбище, участок 14-3. Следующий шаг — проверка качества.</div>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
  <span style="background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Работа выполняется</span>
  <span style="background:var(--info-soft);color:var(--info);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Смета готова</span>
  <span style="background:var(--warning-soft);color:var(--warning);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Ожидается оплата</span>
  <span style="background:var(--success);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Завершено</span>
  <span style="background:var(--danger-soft);color:var(--danger);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Обращение рассматривается</span>
</div>
<div style="display:flex;gap:8px;">
  <span style="background:var(--surface-raised);border:1px solid var(--border);color:var(--ink-2);font-size:12px;font-weight:500;border-radius:999px;padding:5px 12px;">Смоленское кладбище</span>
  <span style="background:var(--surface-raised);border:1px solid var(--border);color:var(--ink-2);font-size:12px;font-weight:500;border-radius:999px;padding:5px 12px;">Оплачено ×</span>
</div>
</body></html>
