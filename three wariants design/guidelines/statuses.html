<!-- @dsCard group="Brand" viewport="700x180" subtitle="Публичные статусы заказа — текст + CTA" name="Статусы" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;">
<span style="background:var(--paper);border:1px solid var(--border-strong);color:var(--ink-2);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Проверяем данные</span>
<span style="background:var(--info-soft);color:var(--info);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Смета готова</span>
<span style="background:var(--warning-soft);color:var(--warning);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Ожидается оплата</span>
<span style="background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Работа выполняется</span>
<span style="background:var(--info-soft);color:var(--info);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Проверяем качество</span>
<span style="background:var(--success-soft);color:var(--success);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Отчёт готов</span>
<span style="background:var(--success);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Завершено</span>
<span style="background:var(--danger-soft);color:var(--danger);font-size:12px;font-weight:600;border-radius:999px;padding:6px 14px;">Обращение рассматривается</span>
<div style="width:100%;font-size:12px;color:var(--ink-3);">Статус никогда не передаётся только цветом — всегда текст. Без «срочно» и таймеров давления.</div>
</body></html>
