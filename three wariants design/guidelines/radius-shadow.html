<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px;display:flex;gap:16px;align-items:center;">
<div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px;font-size:12px;color:var(--ink-2);">Карточка<br>radius 4 · shadow-card</div>
<div style="flex:1;background:var(--surface-raised);border-radius:var(--radius-modal);box-shadow:var(--shadow-modal);padding:16px;font-size:12px;color:var(--ink-2);">Модальное окно<br>radius 6 · shadow-modal</div>
<button style="background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-pill);padding:13px 26px;font-family:var(--font-ui);font-size:14px;font-weight:600;">Pill · 999px</button>
</body></html>
