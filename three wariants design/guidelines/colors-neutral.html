<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="display:flex;gap:12px;padding:20px;">
<div style="flex:1;border-radius:4px;background:var(--paper);border:1px solid var(--border);padding:12px;font-size:12px;color:var(--ink-2);">--paper<br>#F5F3EE</div>
<div style="flex:1;border-radius:4px;background:var(--surface);border:1px solid var(--border);padding:12px;font-size:12px;color:var(--ink-2);">--surface<br>#FBFAF6</div>
<div style="flex:1;border-radius:4px;background:var(--border);padding:12px;font-size:12px;color:var(--ink-2);">--border<br>#E3DFD4</div>
<div style="flex:1;border-radius:4px;background:var(--ink-3);color:#fff;padding:12px;font-size:12px;">--ink-3<br>#8A8F87</div>
<div style="flex:1;border-radius:4px;background:var(--ink-2);color:#fff;padding:12px;font-size:12px;">--ink-2<br>#5A5F58</div>
<div style="flex:1;border-radius:4px;background:var(--ink-1);color:#fff;padding:12px;font-size:12px;">--ink-1<br>#2B2F2B</div>
</body></html>
