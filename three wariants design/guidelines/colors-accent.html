<!-- @dsCard group="Colors" viewport="700x150" subtitle="Акцент — приглушённый зелёный" name="Акцентные цвета" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="display:flex;gap:12px;padding:20px;align-items:stretch;">
<div style="flex:1;border-radius:4px;background:var(--accent);color:var(--on-accent);padding:12px;font-size:12px;">--accent<br>#4A6151</div>
<div style="flex:1;border-radius:4px;background:var(--accent-hover);color:var(--on-accent);padding:12px;font-size:12px;">--accent-hover<br>#3C5142</div>
<div style="flex:1;border-radius:4px;background:var(--accent-deep);color:var(--on-accent);padding:12px;font-size:12px;">--accent-deep<br>#33473A</div>
<div style="flex:1;border-radius:4px;background:var(--accent-soft);color:var(--accent-deep);padding:12px;font-size:12px;border:1px solid var(--border);">--accent-soft<br>#E9EDE7</div>
</body></html>
