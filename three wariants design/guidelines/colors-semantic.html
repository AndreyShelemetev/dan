<!-- @dsCard group="Colors" viewport="700x160" subtitle="Приглушённая семантика — без алого" name="Семантические цвета" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="display:flex;gap:12px;padding:20px;">
<div style="flex:1;"><div style="height:56px;border-radius:4px 4px 0 0;background:var(--success);"></div><div style="height:32px;border-radius:0 0 4px 4px;background:var(--success-soft);"></div><div style="font-size:12px;color:var(--ink-2);margin-top:6px;">--success · принято</div></div>
<div style="flex:1;"><div style="height:56px;border-radius:4px 4px 0 0;background:var(--info);"></div><div style="height:32px;border-radius:0 0 4px 4px;background:var(--info-soft);"></div><div style="font-size:12px;color:var(--ink-2);margin-top:6px;">--info · в работе</div></div>
<div style="flex:1;"><div style="height:56px;border-radius:4px 4px 0 0;background:var(--warning);"></div><div style="height:32px;border-radius:0 0 4px 4px;background:var(--warning-soft);"></div><div style="font-size:12px;color:var(--ink-2);margin-top:6px;">--warning · нужно решение</div></div>
<div style="flex:1;"><div style="height:56px;border-radius:4px 4px 0 0;background:var(--danger);"></div><div style="height:32px;border-radius:0 0 4px 4px;background:var(--danger-soft);"></div><div style="font-size:12px;color:var(--ink-2);margin-top:6px;">--danger · терракота, не алый</div></div>
</body></html>
