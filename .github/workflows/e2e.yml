name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: E2E (docker compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for Postgres to be healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' pamyat-ryadom-postgres 2>/dev/null || echo starting)"
            [ "$status" = "healthy" ] && exit 0
            echo "postgres: $status ($i/30)"
            sleep 5
          done
          echo "Postgres never became healthy" >&2
          docker compose logs postgres
          exit 1

      - name: Apply migrations
        run: bash deploy/migrate.sh

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5100/api/v1/health >/dev/null 2>&1; then
              exit 0
            fi
            echo "api: not ready yet ($i/30)"
            sleep 5
          done
          echo "API never became ready" >&2
          docker compose logs api
          exit 1

      - name: Wait for the frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/ >/dev/null 2>&1; then
              exit 0
            fi
            echo "frontend: not ready yet ($i/30)"
            sleep 5
          done
          echo "Frontend never became ready" >&2
          docker compose logs frontend
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e specs
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3100
          E2E_API_URL: http://localhost:5100/api/v1
        run: npm run test:e2e

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
